name: Build penguins-eggs-prefix

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distro (leave blank for all tier-1)'
        required: false
        default: ''
      release:
        description: 'Release (leave blank for default)'
        required: false
        default: ''
      arch:
        description: 'Arch (leave blank for all tier-1)'
        required: false
        default: ''
      tier:
        description: 'Maximum tier to build (1=default, 2=weekly, 3=experimental)'
        required: false
        default: '1'
      build_iso:
        description: 'Also produce naked base ISOs (true/false)'
        required: false
        default: 'false'
  schedule:
    # Monthly on the 3rd — after linux-distro-prefix (2nd) so base prefix releases are ready
    - cron: "0 4 3 * *"
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'BUILDING.md'
      - 'integrations/**'

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ── generate matrix ──────────────────────────────────────────────────────────
  generate-matrix:
    name: Generate build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate matrix
        id: gen
        run: |
          TIER="${{ github.event.inputs.tier || '1' }}"
          DISTRO="${{ github.event.inputs.distro || '' }}"
          ARCH="${{ github.event.inputs.arch || '' }}"
          ARGS="--tier ${TIER}"
          [[ -n "$DISTRO" ]] && ARGS="$ARGS --distro $DISTRO"
          [[ -n "$ARCH"   ]] && ARGS="$ARGS --arch $ARCH"
          MATRIX=$(python3 scripts/gen-matrix.py $ARGS)
          echo "matrix=$(echo $MATRIX | jq -c .)" >> "$GITHUB_OUTPUT"

  # ── build prefix ─────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.distro }}/${{ matrix.release }}/${{ matrix.arch }}
    needs: generate-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free additional disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - uses: actions/checkout@v6

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Build prefix
        env:
          BUILD_ISO: ${{ github.event.inputs.build_iso || 'false' }}
        run: |
          ISO_FLAG=""
          [[ "$BUILD_ISO" == "true" ]] && ISO_FLAG="--iso"
          sudo ./build.sh \
            --distro  "${{ matrix.distro }}" \
            --release "${{ matrix.release }}" \
            --arch    "${{ matrix.arch }}" \
            --jobs    "$(nproc)" \
            $ISO_FLAG

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: penguins-eggs-prefix-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            penguins_eggs_prefix_${{ matrix.distro }}_${{ matrix.arch }}_*.tar.gz
            penguins_eggs_prefix_${{ matrix.distro }}_${{ matrix.arch }}_*.tar.gz.sha256
            penguins_eggs_prefix_${{ matrix.distro }}_${{ matrix.arch }}_*.iso
          if-no-files-found: error

  # ── release ───────────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: penguins-eggs-prefix-*
          merge-multiple: true

      - name: Generate release metadata
        id: meta
        run: |
          DATE=$(date +"%Y%m%d")
          echo "tag=${DATE}" >> "$GITHUB_OUTPUT"
          echo "name=penguins-eggs-prefix ${DATE}" >> "$GITHUB_OUTPUT"
          sha256sum penguins_eggs_prefix_*.tar.gz > SHA256SUMS
          echo "checksums<<EOF" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "penguins_eggs_prefix_*.tar.gz,penguins_eggs_prefix_*.tar.gz.sha256,penguins_eggs_prefix_*.iso,SHA256SUMS"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          commit: ${{ github.ref_name }}
          body: |
            Gentoo prefix tarballs (with penguins-eggs ISO tools) for all tier-1 distro/arch combinations.

            Install to `/usr/local` and run `startprefix` to enter the prefix,
            or use with `eggs produce --prefix` to build a live ISO.

            **SHA256 checksums:**
            ```
            ${{ steps.meta.outputs.checksums }}
            ```
